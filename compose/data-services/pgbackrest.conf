[global]
repo1-type=s3
# Bundle small files to reduce repository requests. Keep the default bundle sizes.
repo1-bundle=y
repo1-s3-uri-style=path
repo1-retention-full=2
repo1-retention-full-type=count
compress-type=zst
compress-level=3
process-max=2
start-fast=y
log-level-console=info
log-level-file=off
lock-path=/var/run/postgresql/pgbackrest

[db]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
pg1-database=postgres
