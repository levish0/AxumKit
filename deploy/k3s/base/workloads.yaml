    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: maintenance
          image: hirune-kit
          command: [maintenance]
          envFrom:
            - configMapRef: {name: hirune-settings}
            - secretRef: {name: hirune-app-secrets}
