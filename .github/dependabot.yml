version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /compose/production/app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /compose/verification
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /compose/verification
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /compose/production/postgres
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /compose/data-services
    schedule:
      interval: weekly
