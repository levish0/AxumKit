name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      load_profile:
        description: k6 profile
        type: choice
        options: [smoke, extended]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the release tag and resolve image metadata
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_arguments=()
          if [[ "$REF_TYPE" == tag ]]; then
            tag_arguments=(--tag "$REF_NAME")
          fi
          python3 scripts/release_metadata.py --repository "$REPOSITORY" "${tag_arguments[@]}" >> "$GITHUB_OUTPUT"
  verify:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.52.0
      - name: Install pinned Kubernetes manifest tool
        run: |
          curl --fail --location --retry 3 --output kubectl https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          curl --fail --location --retry 3 --output kubectl.sha256 https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl.sha256
          python3 -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("kubectl").read_bytes()).hexdigest() == pathlib.Path("kubectl.sha256").read_text().strip()'
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl kubectl.sha256
      - run: just check
      - run: just test-db
      - run: just test-job-load
        env:
          JOB_LOAD_PROFILE: ${{ inputs.load_profile || 'smoke' }}
      - name: Retain PostgreSQL job load measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-load-report
          path: target/job-load-report.json
          if-no-files-found: ignore
          retention-days: 7
      - run: just test-api
      - run: just test-process
      - run: just test-files
      - run: just test-content
      - run: just test-deployment
      - run: just template-check
  container:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_id: ${{ steps.identity.outputs.image_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the application candidate once
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker build --file compose/production/app/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag hirune-kit:ci .
      - run: docker build --file compose/production/postgres/Dockerfile --tag hirune-postgres-pgbackrest:ci .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: production-verification
      - run: cargo xtask test-production
        env:
          PRODUCTION_TEST_IMAGE: hirune-kit:ci
      - run: cargo xtask test-data-services
        env:
          DATA_TEST_APP_IMAGE: hirune-kit:ci
          DATA_TEST_POSTGRES_IMAGE: hirune-postgres-pgbackrest:ci
      - name: Install pinned Kubernetes test tools
        run: |
          curl --fail --location --retry 3 --output k3d-linux-amd64 https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          curl --fail --location --retry 3 --output checksums.txt https://github.com/k3d-io/k3d/releases/download/v5.9.0/checksums.txt
          python3 -c 'import hashlib,pathlib; expected = next(line.split()[0] for line in pathlib.Path("checksums.txt").read_text().splitlines() if pathlib.PurePosixPath(line.split()[1]).name == "k3d-linux-amd64"); assert hashlib.sha256(pathlib.Path("k3d-linux-amd64").read_bytes()).hexdigest() == expected'
          sudo install -m 0755 k3d-linux-amd64 /usr/local/bin/k3d
          curl --fail --location --retry 3 --output kubectl https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          curl --fail --location --retry 3 --output kubectl.sha256 https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl.sha256
          python3 -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("kubectl").read_bytes()).hexdigest() == pathlib.Path("kubectl.sha256").read_text().strip()'
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm k3d-linux-amd64 checksums.txt kubectl kubectl.sha256
      - name: Release build caches on the disposable runner
        run: docker builder prune --all --force
      - name: Load k3s network-policy kernel modules
        run: |
          sudo modprobe br_netfilter
          sudo modprobe ip_set
          sudo modprobe xt_set
          sudo modprobe xt_physdev
      - run: cargo xtask test-k3s
        env:
          K3S_TEST_IMAGE: hirune-kit:ci
          K6_PROFILE: ${{ inputs.load_profile || 'smoke' }}
      - name: Record the tested application image identity
        id: identity
        run: |
          image_id="$(docker image inspect hirune-kit:ci --format '{{.Id}}')"
          test -n "$image_id"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Export the tested application image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: docker save --output "$RUNNER_TEMP/application-candidate.tar" hirune-kit:ci
      - name: Transfer the tested image to publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: application-candidate-image
          path: ${{ runner.temp }}/application-candidate.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, verify, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      EXPECTED_IMAGE_ID: ${{ needs.container.outputs.image_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: application-candidate-image
          path: ${{ runner.temp }}
      - name: Load and check the tested image identity
        run: |
          docker load --input "$RUNNER_TEMP/application-candidate.tar"
          actual_id="$(docker image inspect hirune-kit:ci --format '{{.Id}}')"
          test "$actual_id" = "$EXPECTED_IMAGE_ID"
      - name: Publish the tested versioned application image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          target="$IMAGE:$VERSION"
          docker tag hirune-kit:ci "$target"
          docker push "$target"
          reference="$(docker image inspect "$target" --format '{{index .RepoDigests 0}}')"
          test -n "$reference"
          printf 'APPLICATION_IMAGE=%s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
